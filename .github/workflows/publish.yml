name: Publish Packages

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const releaseVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          const packagePaths = [
            "packages/shared/package.json",
            "packages/swagger-api-generator/package.json",
            "packages/swagger-api-ui-generator/package.json",
            "packages/swagger-to-api-cli/package.json",
          ];

          const mismatchedPackages = packagePaths
            .map((packagePath) => {
              const packageJson = JSON.parse(readFileSync(packagePath, "utf8"));

              return {
                name: packageJson.name,
                packagePath,
                version: packageJson.version,
              };
            })
            .filter((packageInfo) => packageInfo.version !== releaseVersion);

          if (mismatchedPackages.length > 0) {
            console.error(`Tag version ${releaseVersion} does not match package versions.`);
            for (const packageInfo of mismatchedPackages) {
              console.error(`${packageInfo.packagePath}: ${packageInfo.name}@${packageInfo.version}`);
            }
            process.exit(1);
          }
          NODE

      - run: pnpm run validate

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm config set registry https://registry.npmjs.org/

      - run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
